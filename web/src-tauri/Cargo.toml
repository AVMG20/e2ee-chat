[package]
name = "e2ee-chat-desktop"
version = "0.1.0"
description = "E2EE Chat desktop app"
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "e2ee_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2"
